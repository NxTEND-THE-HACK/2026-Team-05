[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; The Sense expansion board has external Octal PSRAM. Keep it enabled so the
; camera can use two JPEG frame buffers and prefer the newest frame.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

