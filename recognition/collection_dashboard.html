<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaPipeランドマーク収集</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1220; color: #f3f6ff; }
    main { width: min(760px, calc(100vw - 40px)); padding: 34px; border: 1px solid #35415d; border-radius: 22px; background: #171e2e; box-shadow: 0 18px 60px #0005; }
    .eyebrow { color: #8ea5d6; font-size: 14px; letter-spacing: .08em; }
    h1 { margin: 8px 0 18px; font-size: clamp(28px, 6vw, 54px); }
    #instruction { min-height: 2.4em; color: #f7d98b; font-size: clamp(22px, 4vw, 34px); font-weight: 800; }
    #phase { margin-top: 20px; color: #b4c1da; font-size: 20px; }
    .countdown { margin: 28px 0; font-size: clamp(54px, 14vw, 120px); font-weight: 900; text-align: center; color: #7dd3fc; }
    .progress { height: 16px; overflow: hidden; border-radius: 999px; background: #2a3550; }
    #progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #38bdf8, #a78bfa); transition: width .2s; }
    .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    .detail { padding: 14px; border-radius: 12px; background: #202a40; }
    .label { color: #9fb0c9; font-size: 13px; }
    .value { margin-top: 4px; font-size: 20px; font-weight: 700; }
    #error { margin-top: 18px; color: #fca5a5; }
    @media (max-width: 560px) { main { padding: 24px; } .details { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">MEDIAPIPE LANDMARK COLLECTION</div>
    <h1 id="motion">準備中</h1>
    <div id="instruction">カメラの前で普段の姿勢で待ってください。</div>
    <div id="phase">収集状態を待っています…</div>
    <div class="countdown" id="countdown">—</div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="details">
      <div class="detail"><div class="label">ポーズ種類</div><div class="value" id="motion-progress">—</div></div>
      <div class="detail"><div class="label">今回の回数</div><div class="value" id="sample-progress">—</div></div>
      <div class="detail"><div class="label">保存フレーム</div><div class="value" id="records">0</div></div>
    </div>
    <div id="error"></div>
  </main>
  <script>
    const statusUrl = "/data/collection_status.json";
    const motion = document.getElementById("motion");
    const instruction = document.getElementById("instruction");
    const phase = document.getElementById("phase");
    const countdown = document.getElementById("countdown");
    const motionProgress = document.getElementById("motion-progress");
    const sampleProgress = document.getElementById("sample-progress");
    const records = document.getElementById("records");
    const progressBar = document.getElementById("progress-bar");
    const error = document.getElementById("error");

    async function refresh() {
      try {
        const response = await fetch(`${statusUrl}?t=${Date.now()}`, {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const state = await response.json();
        motion.textContent = state.motion_name || "準備中";
        instruction.textContent = state.phase_text || "—";
        phase.textContent = state.state === "completed" ? "収集完了" : `${state.phase || "—"} / ${state.message || ""}`;
        countdown.textContent = state.phase_remaining_seconds == null ? "—" : `${Number(state.phase_remaining_seconds).toFixed(1)}秒`;
        motionProgress.textContent = state.motion_index ? `${state.motion_index} / ${state.motion_total}` : "—";
        sampleProgress.textContent = state.sample_number ? `${state.sample_number} / ${state.samples_per_motion}` : "—";
        records.textContent = `${state.saved_records || 0} フレーム`;
        const percent = state.segments_total ? (Number(state.segment_index || 0) / Number(state.segments_total)) * 100 : 0;
        progressBar.style.width = `${Math.max(0, Math.min(100, percent))}%`;
        error.textContent = state.message && state.state === "stopped" ? state.message : "";
      } catch (err) {
        error.textContent = "収集状態を取得できません。収集プロセスを確認してください。";
      }
    }
    refresh();
    setInterval(refresh, 250);
  </script>
</body>
</html>
