openapi: 3.1.0
info:
  title: Gesture Smart Home API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      responses:
        "200":
          description: Healthy
  /internal/detections:
    post:
      summary: Receive a motion detection event
      description: camera_id identifies the recognition source/room and never implies a target device. The backend executes only an explicitly configured binding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionEvent"
      responses:
        "200":
          description: The event was processed or deduplicated
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/cameras:
    get:
      responses:
        "200":
          description: Camera list
          content:
            application/json:
              schema:
                type: object
                required: [cameras]
                properties:
                  cameras:
                    type: array
                    items: { $ref: "#/components/schemas/Camera" }
  /api/motions:
    get:
      responses:
        "200":
          description: Motion list
          content:
            application/json:
              schema:
                type: object
                required: [motions]
                properties:
                  motions:
                    type: array
                    items: { $ref: "#/components/schemas/Motion" }
  /api/appliances:
    get:
      responses:
        "200":
          description: Appliance list
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppliance"
      responses:
        "201":
          description: Created appliance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appliance" }
  /api/actions:
    get:
      parameters:
        - in: query
          name: applianceId
          schema: { type: string }
      responses:
        "200":
          description: Action list
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAction"
      responses:
        "201":
          description: Created action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
  /api/actions/{id}:
    delete:
      summary: Delete a registered appliance action
      description: Deleting an action also removes motion bindings that reference it.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Action deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/actions/{id}/execute:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Manual execution result
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
                  message: { type: string }
        "409":
          $ref: "#/components/responses/Conflict"
  /api/appliances/{id}/ir/health:
    get:
      summary: Get the ESP32 infrared controller status for an appliance
      parameters:
        - $ref: "#/components/parameters/ApplianceId"
      responses:
        "200":
          description: Infrared controller status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRHealth" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/appliances/{id}/ir/learn/start:
    post:
      summary: Start a one-shot infrared learning session
      parameters:
        - $ref: "#/components/parameters/ApplianceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timeoutSeconds:
                  type: integer
                  minimum: 5
                  maximum: 120
                  description: Omit to use IR_LEARNING_TIMEOUT_SECONDS.
      responses:
        "200":
          description: Learning started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRLearningSession" }
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/appliances/{id}/ir/learn/status:
    get:
      summary: Poll the active infrared learning session
      description: A normal capture is cached by the backend and the ESP32 learning mode is stopped before state=captured is returned. Repeat frames are ignored.
      parameters:
        - $ref: "#/components/parameters/ApplianceId"
      responses:
        "200":
          description: Current learning state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRLearningSession" }
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
  /api/appliances/{id}/ir/learn/confirm:
    post:
      summary: Save the captured infrared signal as an appliance action
      parameters:
        - $ref: "#/components/parameters/ApplianceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmIRLearning" }
      responses:
        "201":
          description: Learned action created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/appliances/{id}/ir/learn/stop:
    post:
      summary: Cancel the active infrared learning session
      parameters:
        - $ref: "#/components/parameters/ApplianceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sessionId: { type: string }
      responses:
        "200":
          description: Learning stopped
          content:
            application/json:
              schema:
                type: object
                required: [ok, state]
                properties:
                  ok: { type: boolean, const: true }
                  state: { type: string, const: idle }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/appliances/{id}/ir/test:
    post:
      summary: Emit a camera-visible infrared LED test signal
      parameters:
        - $ref: "#/components/parameters/ApplianceId"
      responses:
        "200":
          description: Test signal emitted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/bindings:
    get:
      responses:
        "200":
          description: Binding list
    post:
      description: Creates a motion-to-action binding or replaces the action assigned to an existing motion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBinding"
      responses:
        "201":
          description: Created or updated binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionBinding" }
  /api/bindings/{id}:
    delete:
      summary: Delete a motion-to-action binding
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Binding deleted
        "404":
          description: Binding not found
  /api/logs:
    get:
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Action log list
  /api/logs/stream:
    get:
      summary: Stream newly persisted action logs
      responses:
        "200":
          description: Server-sent event stream. Events use `log` with an ActionLog JSON payload.
          content:
            text/event-stream:
              schema:
                type: string
components:
  parameters:
    ApplianceId:
      in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    NotFound:
      description: Resource or learning session not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RequestTimeout:
      description: Infrared learning timed out
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Infrared controller is busy, the capture is not ready, or the action name already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Infrared controller is not configured or is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    DetectionEvent:
      type: object
      additionalProperties: false
      required: [event_id, camera_id, motion_code, confidence, detected_at]
      properties:
        event_id: { type: string, maxLength: 128 }
        camera_id: { type: string }
        motion_code: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        detected_at: { type: string, format: date-time }
    Camera:
      type: object
      required: [id, name, streamUrl, location, isEnabled, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        streamUrl: { type: string }
        location: { type: string }
        isEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    Motion:
      type: object
      required: [id, code, name, description]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
    Appliance:
      type: object
      required: [id, name, category, controlProvider, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        controlProvider: { type: string, enum: [TUYA, ESP32_IR] }
        controllerId:
          type: string
          description: Present for ESP32_IR appliances.
        createdAt: { type: string, format: date-time }
    CreateAppliance:
      type: object
      additionalProperties: false
      required: [name, category]
      properties:
        name: { type: string }
        category: { type: string }
        controlProvider:
          type: string
          enum: [TUYA, ESP32_IR]
          default: TUYA
        controllerId:
          type: string
          description: Optional for ESP32_IR; defaults to IR_CONTROLLER_ID. Invalid for TUYA.
    Action:
      type: object
      required: [id, applianceId, name, providerType, params]
      properties:
        id: { type: string }
        applianceId: { type: string }
        name: { type: string }
        providerType: { type: string, enum: [TUYA, ESP32_IR] }
        params:
          oneOf:
            - $ref: "#/components/schemas/TuyaParams"
            - $ref: "#/components/schemas/IRParams"
    CreateAction:
      type: object
      additionalProperties: false
      required: [applianceId, name, providerType, params]
      properties:
        applianceId: { type: string }
        name: { type: string }
        providerType: { type: string, enum: [TUYA, ESP32_IR] }
        params:
          oneOf:
            - $ref: "#/components/schemas/TuyaParams"
            - $ref: "#/components/schemas/IRParams"
    TuyaParams:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        deviceId: { type: string }
        deviceIdEnv: { type: string, enum: [PLUG_A_ID, PLUG_B_ID, PLUG_C_ID] }
        switchCode: { type: string, default: switch }
        value: { type: boolean }
    IRSignal:
      type: object
      additionalProperties: false
      required: [protocol, carrierHz]
      anyOf:
        - required: [code, bits]
        - required: [raw]
      properties:
        protocol:
          type: string
          pattern: "^[A-Za-z0-9_+-]+$"
          maxLength: 32
        bits: { type: integer, minimum: 1, maximum: 1024 }
        code:
          type: string
          pattern: "^0x[0-9A-Fa-f]+$"
        address:
          type: string
          pattern: "^0x[0-9A-Fa-f]+$"
        command:
          type: string
          pattern: "^0x[0-9A-Fa-f]+$"
        raw:
          type: array
          maxItems: 4096
          items: { type: integer, minimum: 1, maximum: 1000000 }
        carrierHz: { type: integer, minimum: 30000, maximum: 60000 }
    IRParams:
      type: object
      additionalProperties: false
      required: [controllerId, signal, repeat]
      properties:
        controllerId: { type: string }
        signal: { $ref: "#/components/schemas/IRSignal" }
        repeat: { type: integer, minimum: 1, maximum: 5 }
    IRHealth:
      type: object
      required: [ok, controllerId, state, wifiConnected]
      properties:
        ok: { type: boolean }
        controllerId: { type: string }
        state: { type: string, enum: [idle, learning, sending, error] }
        wifiConnected: { type: boolean }
        rssi: { type: integer }
        ip: { type: string }
        firmwareVersion: { type: string }
        message: { type: string }
    IRLearnCapture:
      type: object
      required: [captureId, isRepeat, signal]
      properties:
        captureId: { type: string }
        isRepeat: { type: boolean }
        signal: { $ref: "#/components/schemas/IRSignal" }
    IRLearningSession:
      type: object
      required: [sessionId, applianceId, controllerId, state, expiresAt]
      properties:
        sessionId: { type: string }
        applianceId: { type: string }
        controllerId: { type: string }
        state: { type: string, enum: [learning, captured] }
        expiresAt: { type: string, format: date-time }
        capture: { $ref: "#/components/schemas/IRLearnCapture" }
    ConfirmIRLearning:
      type: object
      additionalProperties: false
      required: [sessionId, captureId, name]
      properties:
        sessionId: { type: string }
        captureId: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        repeat: { type: integer, minimum: 1, maximum: 5, default: 1 }
    MotionBinding:
      type: object
      required: [id, motionId, actionId, isEnabled, createdAt]
      properties:
        id: { type: string }
        cameraId:
          type: string
          description: Optional metadata reserved for future room-specific behavior. It is not currently used to select an action.
        motionId: { type: string }
        actionId: { type: string }
        isEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateBinding:
      type: object
      additionalProperties: false
      required: [motionId, actionId]
      properties:
        cameraId:
          type: string
          description: Optional registered camera ID retained for future use.
        motionId: { type: string }
        actionId: { type: string }
